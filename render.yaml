# PanaNexus — Render Blueprint
# Two services: `pananexus-api` (Express + Socket.IO) and `pananexus-web` (Next.js).
#
# Prerequisites on Render:
#  1. Create a Neon PostgreSQL database and copy its POOLED url (database_url) and
#     DIRECT url (direct_url) into the DATABASE_URL / DIRECT_URL env vars below.
#     Migrations and schema verification prefer DIRECT_URL (unpooled).
#  2. Set AUTH_SECRET to a long random string (e.g. 64 hex chars). This signs sessions.
#  3. Schema lifecycle runs inside the API start command (npm start):
#     `npm prestart` = prisma db migrate (replay, idempotent — nothing to run when up to
#     date) followed by prisma db verify (exit 0 only when the marker + live schema match
#     the contract). Only then does Express boot. Render's preDeployCommand is NOT used:
#     it runs before the build installs node_modules, so the Prisma CLI is unavailable
#     there — that is why migrations must run at start, after `npm ci` + build.
#  4. For admin bootstrap, ADMIN_EMAIL + ADMIN_PASSWORD are provided; the admin account
#     is created/verified automatically on first boot (idempotent).
#  6. The build sets NODE_ENV=production, which makes npm omit devDependencies by
#     default (the backend needs typescript, @types/*, vitest; the frontend needs
#     typescript, @types/*, tailwindcss, eslint, vitest). The build commands force
#     NODE_ENV=development for the install step only — that guarantees devDependencies
#     are installed regardless of whatever npm omit/include config the builder injects.
#     npm ci also rebuilds node_modules from the lockfile on every build (no stale,
#     devDep-less cache). Runtime keeps NODE_ENV=production; node_modules already
#     contains everything `npm start` needs (including the Prisma CLI for the prestart
#     migration + verify).
#  5. Run seed (optional demo content) from a machine with access to the Neon DB:
#        cd backend && npm run seed -- --demo

services:
  - name: pananexus-api
    type: web
    env: node
    plan: starter
    buildCommand: cd backend && NODE_ENV=development npm ci && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: TZ
        value: Asia/Kolkata
      - key: STORAGE_DRIVER
        value: s3
      # S3-compatible object storage for private medical reports. Required in
      # production (the API refuses to boot with local disk). Set these as secret
      # environment variables in the Render dashboard — never commit credentials.
      # Keep the bucket private; downloads are served via short-lived presigned URLs.
      - key: AWS_REGION
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://pananexus-web.onrender.com
      - key: ADMIN_EMAIL
        value: pananexusadmin@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: RATE_LIMIT
        value: 900
      - key: AUTH_RATE_LIMIT
        value: 30

  - name: pananexus-web
    type: web
    env: node
    plan: starter
    buildCommand: cd frontend && NODE_ENV=development npm ci && npm run build
    startCommand: cd frontend && npm run start
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://pananexus-api.onrender.com