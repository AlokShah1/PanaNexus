# PanaNexus — Render Blueprint
# Two services: `pananexus-api` (Express + Socket.IO) and `pananexus-web` (Next.js).
#
# Prerequisites on Render:
#  1. Create a Neon PostgreSQL database and copy its POOLED url (database_url) and
#     DIRECT url (direct_url) into the DATABASE_URL / DIRECT_URL env vars below.
#     Migrations run against DIRECT_URL (unpooled) only.
#  2. Set AUTH_SECRET to a long random string (e.g. 64 hex chars). This signs sessions.
#  3. The API's preDeployCommand applies the Prisma migrations (baseline + any future
#     ones) to the Neon DIRECT_URL before build/start, so the app never boots against
#     an uninitialized schema. The serve also refuses to start if the schema is missing.
#  4. For admin bootstrap, ADMIN_EMAIL + ADMIN_PASSWORD are provided; the admin account
#     is created/verified automatically on first boot (idempotent).
#  5. Run seed (optional demo content) from a machine with access to the Neon DB:
#        cd backend && npm run seed -- --demo

services:
  - name: pananexus-api
    type: web
    env: node
    plan: starter
    buildCommand: cd backend && npm ci && npm run build
    preDeployCommand: cd backend && npx prisma db migrate --db "$DIRECT_URL"
    startCommand: cd backend && node dist/src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://pananexus-web.onrender.com
      - key: ADMIN_EMAIL
        value: pananexusadmin@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: RATE_LIMIT
        value: 900
      - key: AUTH_RATE_LIMIT
        value: 30

  - name: pananexus-web
    type: web
    env: node
    plan: starter
    buildCommand: cd frontend && npm ci && npm run build
    startCommand: cd frontend && npm run start
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://pananexus-api.onrender.com